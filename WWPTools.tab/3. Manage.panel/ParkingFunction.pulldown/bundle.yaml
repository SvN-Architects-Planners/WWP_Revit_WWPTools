title: "Parking\nFunctions"
tooltip: |
  A set of tools for managing parking in Revit:

  • Parking Layout Solver — auto-places parking stall families inside a Room
    boundary using an edge-referenced perimetral + double-loaded aisle algorithm.
    Supports multiple spot types (Standard, ADA), configurable stall dimensions,
    skirt offset, and perimetral modes.

  • Parking Count in Room/Area — reads parking elements in the current view and
    writes their counts back to the associated Room/Area parameters.
author: "Jason Tian"
