title: "Family\nSwapper"
tooltip: |
  Purpose: Swap all instances of a source titleblock family to a target family, remapping parameter values between old and new names.
  Usage: Edit SOURCE_FAMILY, TYPE_NAME_MAP, and PARAM_MAP at the top of the script, then run repeatedly until "Source remaining: 0".
  Version: 2.0.0
author: "Jason Tian"
