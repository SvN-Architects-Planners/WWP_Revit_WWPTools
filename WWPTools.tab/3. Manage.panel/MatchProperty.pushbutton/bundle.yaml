title: "Match\nProperty"
tooltip: |
  Purpose: Copy instance parameter values from a source element to one or more target elements of the same category.
  Usage: Pre-select elements (first = source, rest = targets) before running, or use the pick prompts. A parameter list lets you choose which values to match. Read-only parameters are shown greyed out.
  Version: 1.5.0
author: "Jason Tian"
